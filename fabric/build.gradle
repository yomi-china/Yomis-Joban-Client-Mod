plugins {
	id "com.github.johnrengelman.shadow"
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	modApi "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"
	// Mirrors the architectury-forge dependency in the forge module. Not needed by this mod's
	// own code (it uses @ExpectPlatform instead), but other mods in the dev runtime and
	// compiler/annotation processors expect it to be present.
	modApi "${rootProject.architectury_id}:architectury-fabric:${rootProject.architectury_version}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

	// Rhino is bundled with the mod: it is not provided by Minecraft nor by MTR.
	// It is relocated into a private package by :rhino so that other mods' own
	// Rhino copies can never shadow it.
	implementation project(":rhino")
	shadowCommon(project(":rhino")) { transitive = false }
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand (
			"version": "${project.mod_version}+mc${rootProject.minecraft_version}",
			"mc_version": rootProject.mc_requirement
		)
	}
}

shadowJar {
	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

task moveFabricBuilds() {
//	doLast {
//		delete fileTree("../build").matching {
//			include "**/Joban-Client-Mod-fabric*"
//		}
//	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveFabricBuilds
		}
	}
}

