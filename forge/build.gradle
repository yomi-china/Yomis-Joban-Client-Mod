plugins {
	id "com.github.johnrengelman.shadow"
}

loom {
	forge {
		mixinConfig "jsblock-common.mixins.json"
	}
}

architectury {
	platformSetupLoomIde()
	forge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common
}

// Architectury Loom puts its Forge runtime helper on the classpath. It registers a
// Yarn-only INameMappingService ("srgtoyarn") for the "srg" mapping, which collides with
// Forge's own "srgtomcp" service and aborts ModLauncher startup before the game launches.
// The project uses Mojang mappings, so the Yarn helper is not needed.
configurations.configureEach {
	exclude group: "dev.architectury", module: "architectury-loom-runtime"
}


dependencies {
	forge "net.minecraftforge:forge:${rootProject.forge_version}"
	modApi "${rootProject.architectury_id}:architectury-forge:${rootProject.architectury_version}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

	// Rhino is bundled with the mod: it is not provided by Minecraft nor by MTR.
	// It is relocated into a private package by :rhino so that other mods' own
	// Rhino copies can never shadow it.
	implementation project(":rhino")
	shadowCommon(project(":rhino")) { transitive = false }
}

processResources {
	filesMatching("META-INF/mods.toml") {
		expand (
			"version": "${project.mod_version}+mc${rootProject.minecraft_version}",
			"mc_version": rootProject.mc_requirement.replace(".x", "")
		)
	}
}

shadowJar {
	exclude "fabric.mod.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

task moveForgeBuilds() {
//	doLast {
//		delete fileTree("../build").matching {
//			include "**/Joban-Client-Mod-forge*"
//		}
//	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveForgeBuilds
		}
	}
}

tasks.register("dumpLoomRuntime") {
	doLast {
		configurations.each { c ->
			if (c.canBeResolved) {
				try {
					def hit = c.resolvedConfiguration.lenientConfiguration.files.any { it.name.contains("architectury-loom-runtime") }
					if (hit) println "HIT: " + c.name
				} catch (Throwable ignored) { }
			}
		}
	}
}

tasks.matching { it.name == "runClient" }.configureEach {
	doFirst {
		new File(project.projectDir, "launch-info.txt").text = "JVMARGS:\n" + jvmArgs.join("\n") + "\n\nSYS:\n" + (systemProperties.collect { k, v -> "$k=$v" }.join("\n")) + "\n\nARGS:\n" + args.join("\n")
	}
}